<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special Surprise for you</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&family=Outfit:wght@400;600;800&display=swap');

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background: #06020e; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        #app-container {
            width: 100%; 
            max-width: 420px; 
            height: 100%; 
            max-height: 880px; 
            position: relative;
            background: radial-gradient(circle at 50% 10%, #290940 0%, #110521 50%, #06020e 100%);
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 0 50px rgba(186, 85, 211, 0.25), 0 0 100px rgba(0,0,0,0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Ambient Glowing Orbs */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 1;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        .glow-1 { width: 180px; height: 180px; background: #e024c3; top: -20px; left: -20px; }
        .glow-2 { width: 160px; height: 160px; background: #6366f1; bottom: 40px; right: -20px; animation-delay: -3s; }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.3) translate(15px, 20px); opacity: 0.55; }
        }

        /* Bokeh Particles */
        .bokeh { 
            position: absolute; 
            border-radius: 50%; 
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%); 
            animation: floatParticle 10s infinite linear; 
            z-index: 1; 
            pointer-events: none;
        }
        @keyframes floatParticle { 
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; } 
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-80px) scale(1.3); opacity: 0; } 
        }

        /* Screen Transitions */
        .screen {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10; 
            padding: 24px; 
            opacity: 0; 
            pointer-events: none; 
            transform: scale(0.96) translateY(12px);
            transition: opacity 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .screen.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1) translateY(0); 
        }
        
        .back-nav-btn {
            position: absolute;
            top: 22px;
            left: 22px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fce7f3;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .back-nav-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Gift Animation */
        .gift-box { 
            font-size: 135px; 
            filter: drop-shadow(0 0 35px rgba(255, 75, 175, 0.65)); 
            animation: bounceGift 2.4s infinite ease-in-out; 
            cursor: pointer; 
            margin-top: 45px;
            transition: transform 0.3s;
        }
        .gift-box:active { transform: scale(0.9); }
        @keyframes bounceGift { 
            0%, 100% { transform: translateY(0) scale(1); } 
            50% { transform: translateY(-22px) scale(1.05) rotate(3deg); } 
        }

        /* Falling Flowers */
        .falling-flower {
            position: absolute;
            top: -50px;
            z-index: 35;
            pointer-events: none;
            animation: fallFlower linear forwards;
        }
        @keyframes fallFlower {
            0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(112vh) rotate(420deg) scale(1.2); opacity: 0; }
        }

        .pulse-text { 
            font-size: 19px; 
            font-weight: 500;
            color: #fbcfe8; 
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.6);
            animation: pulse 1.6s infinite ease-in-out; 
        }
        @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

        /* Passcode UI */
        .time-header h1 { 
            font-family: 'Outfit', sans-serif;
            font-size: 64px; 
            font-weight: 700; 
            line-height: 1; 
            margin-top: -10px;
            background: linear-gradient(180deg, #ffffff 40%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pin-dots { display: flex; gap: 16px; margin: 24px 0; }
        .dot { 
            width: 16px; height: 16px; 
            border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.3); 
            background: rgba(255,255,255,0.05);
            transition: all 0.25s ease; 
        }
        .dot.active { 
            background: #f472b6; 
            border-color: #f472b6; 
            box-shadow: 0 0 15px #f472b6, 0 0 30px rgba(244, 114, 182, 0.6); 
            transform: scale(1.15);
        }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 24px; }
        .key { 
            width: 66px; height: 66px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 500;
            cursor: pointer; 
            transition: 0.15s ease; 
            backdrop-filter: blur(10px);
        }
        .key:active { 
            background: rgba(244, 114, 182, 0.35); 
            border-color: rgba(244, 114, 182, 0.6);
            transform: scale(0.92);
        }

        /* Message Screen Styling */
        .message-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(244, 114, 182, 0.4);
            border-radius: 24px;
            padding: 26px 20px;
            width: 100%;
            max-width: 340px;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(244, 114, 182, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .message-emoji {
            font-size: 55px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 18px rgba(244, 114, 182, 0.7));
            animation: pulse 2s infinite ease-in-out;
        }

        .message-title {
            font-size: 22px;
            font-weight: 700;
            color: #f472b6;
            margin-bottom: 14px;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.4);
        }

        .message-body {
    font-size: 14px;
    line-height: 1.7;
    color: #fce7f3;
    font-weight: 400;
    text-align: center;
    overflow-y: auto;   /* Yeh scroll on karega */
    max-height: 45vh;   /* Yeh box ki height limit karega */
    padding-right: 6px;
    -webkit-overflow-scrolling: touch;
}


        .message-footer {
            margin-top: 18px;
            font-size: 13px;
            color: #fbbf24;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Ambient Lights -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Floating Bokeh -->
    <div class="bokeh" style="width: 80px; height: 80px; left: 10%; animation-duration: 8s;"></div>
    <div class="bokeh" style="width: 50px; height: 50px; left: 65%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="bokeh" style="width: 65px; height: 65px; left: 35%; animation-duration: 10s; animation-delay: 4s;"></div>
    
    <!-- Screen 1: Gift -->
    <div class="screen active" id="s1">
        <h1 style="font-size: 26px; font-weight: 700; text-shadow: 0 0 15px rgba(244, 114, 182, 0.6); text-align: center;">A surprise awaits you...</h1>
        <p style="color: #fbbf24; margin-bottom: 20px; font-size: 14px; letter-spacing: 0.5px;">✨ Something special, just for you ✨</p>
        <div class="gift-box" onclick="openGift()">🎁</div>
        <p id="tap-txt" class="pulse-text" style="margin-top: 45px;">Tap the gift to open 🎁</p>
    </div>

    <!-- Screen 2: Passcode -->
    <div class="screen" id="s2">
        <button class="back-nav-btn" onclick="nav('s2', 's1')">← Back</button>
        <div class="time-header">
            <h1 id="clock">00:00</h1>
            <p style="color: #f472b6; text-align: center; font-size: 14px; font-weight: 500;">Special Surprise for you 💝</p>
        </div>
        <div style="font-size: 38px; margin: 8px 0; transition: transform 0.3s;" id="lock">🔒</div>
        <p id="msg" style="color: #e2e8f0; font-size: 14px;">Enter the secret code 💕</p>
        <div style="background: rgba(255,255,255,0.08); border: 1px solid rgba(251, 191, 36, 0.3); padding: 4px 16px; border-radius: 20px; font-size: 12px; color:#fbbf24; margin-top:8px; font-weight: 600;">Date of Birth</div>
        <div class="pin-dots">
            <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
        </div>
        <div class="keypad">
            <button class="key" onclick="typePin('1')">1</button><button class="key" onclick="typePin('2')">2</button><button class="key" onclick="typePin('3')">3</button>
            <button class="key" onclick="typePin('4')">4</button><button class="key" onclick="typePin('5')">5</button><button class="key" onclick="typePin('6')">6</button>
            <button class="key" onclick="typePin('7')">7</button><button class="key" onclick="typePin('8')">8</button><button class="key" onclick="typePin('9')">9</button>
            <div></div><button class="key" onclick="typePin('0')">0</button><button class="key" onclick="delPin()" style="background:none; border:none; color:#f472b6;">⌫</button>
        </div>
    </div>

    <!-- Screen 3: Single Message Page -->
    <div class="screen" id="s-msg">
        <button class="back-nav-btn" onclick="nav('s-msg', 's2')">
        
        <div class="message-card">
            <div class="message-emoji">(●'◡'●)</div>
            <h2 class="message-title">राधे राधे 💕</h2>
            <p class="message-body">
               Sirf Gmail pta hai to koi fark nhi padta humko bhi Aapka Gmail pta hai aur kisi ka pass agar aapka Gmail sign in hai tb vo Aapke pure phone me photo video location hi dekh sakte hai ye Aap nhi qu ki ye to aapke mummy ke Gmail se hai na Fir bhi Aap ek baar check kijiye Is app me account setting me Number aur Gmail kon sa hai aur kiska hai... Aur Haan Good Night But kl aur Aaj Mujhe Aapse baat karna tha Mujhe Kuchh baat share karna tha itna lamba message ho gya pta nhi padhogi bhi ya nhi waise kl Dadi ka तेरहवीं hai aur kl hi mera second shift me physics ka Paper bhi hai aur parso se matlab 16 se 26 tb Exam centre me duty 6 bje se 6 bhe tk Good Night 😌😌
            </p>
            <div class="message-footer">Always wishing the best for you 💖✨</div>
        </div>
    </div>

</div>

<script>
    function nav(hideId, showId) {
        document.getElementById(hideId).classList.remove('active');
        setTimeout(() => {
            document.getElementById(showId).classList.add('active');
        }, 550);
    }

    let gifted = false;
    function openGift() {
        if(gifted) return; 
        gifted = true;
        
        document.querySelector('.gift-box').style.animation = 'none';
        document.querySelector('.gift-box').innerHTML = '🌸';
        document.getElementById('tap-txt').innerHTML = "Made with love, just for you 💕";
        document.getElementById('tap-txt').style.color = "#fbbf24";
        
        const flowers = ['🌸', '🌺', '🌹', '🌻', '🌼', '🌷', '✨', '💖'];
        
        for(let i = 0; i < 40; i++) {
            setTimeout(() => {
                let flower = document.createElement('div');
                flower.className = 'falling-flower';
                flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                
                flower.style.left = (Math.random() * 90 + 5) + '%';
                flower.style.fontSize = (Math.random() * 18 + 22) + 'px';
                
                const duration = (Math.random() * 1.5 + 2.0);
                flower.style.animationDuration = duration + 's';

                document.getElementById('app-container').appendChild(flower);
                
                setTimeout(() => flower.remove(), duration * 1000);
            }, i * 70);
        }
        
        setTimeout(() => nav('s1', 's2'), 2800);
    }

    setInterval(() => {
        let now = new Date();
        document.getElementById('clock').innerText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }, 1000);

    let pin = "";
    function typePin(n) {
        if(pin.length < 4) {
            pin += n;
            for(let i=1; i<=4; i++) document.getElementById('d'+i).className = i <= pin.length ? 'dot active' : 'dot';
            if(pin.length === 4) checkPin();
        }
    }
    function delPin() {
        if(pin.length > 0) {
            pin = pin.slice(0, -1);
            for(let i=1; i<=4; i++) document.getElementById('d'+i).className = i <= pin.length ? 'dot active' : 'dot';
        }
    }
    function checkPin() {
        setTimeout(() => {
            // Password set to 1208
            if(pin === "1208") {
                document.getElementById('lock').innerText = "🔓";
                document.getElementById('lock').style.transform = "scale(1.25) rotate(-10deg)";
                document.getElementById('msg').innerHTML = "Welcome! 💖 Opening...";
                document.getElementById('msg').style.color = "#f472b6";
                
                // Show celebration flower shower
                triggerFlowerShower();
                
                // Directly navigate to Message Page
                setTimeout(() => nav('s2', 's-msg'), 900);
            } else {
                pin = "";
                for(let i=1; i<=4; i++) document.getElementById('d'+i).className = 'dot';
                document.getElementById('msg').innerText = "Wrong code! Try again.";
                document.getElementById('msg').style.color = "#f87171";
            }
        }, 250);
    }

    function triggerFlowerShower() {
        const icons = ['🌸', '✨', '💖', '🎉', '🌷', '⭐'];
        for(let i = 0; i < 35; i++) {
            setTimeout(() => {
                let item = document.createElement('div');
                item.className = 'falling-flower';
                item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                item.style.left = (Math.random() * 90 + 5) + '%';
                item.style.fontSize = (Math.random() * 16 + 20) + 'px';
                const duration = (Math.random() * 1.5 + 2.0);
                item.style.animationDuration = duration + 's';
                document.getElementById('app-container').appendChild(item);
                setTimeout(() => item.remove(), duration * 1000);
            }, i * 60);
        }
    }
</script>
</body>
</html>
